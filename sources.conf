# sources.conf — trusted-service-ranges
#
# EN  One line per source:  category|name|type|argument|option|minimum
# FR  Une ligne par source : catégorie|nom|type|argument|option|minimum
#
#   category   web   → tcp/80,443   crawlers, link previews, AI assistants, webhooks
#   catégorie  dns   → udp+tcp/53   public resolvers querying authoritative servers
#              mail  → tcp/25       outbound MTAs of major mailbox providers (SPF)
#              grey  → no port      shared egress (many users behind one IP): never exempt,
#                                   only never counted when banning a whole /24
#                     aucun port    sorties partagées : jamais exemptées, simplement jamais
#                                   comptées pour bannir un /24 entier
#   name       short unique id (a-z, 0-9, -) / identifiant court unique
#   type       url     argument = https URL ; option = JSON path (a.b) or "csv" (first column);
#                      empty option = every IPv4/CIDR found in the text
#              spf     argument = SPF record ; option = comma-separated domain suffixes that
#                      include:/redirect= may follow (keeps shared ESP pools out)
#              dnstxt  argument = DNS name whose TXT records contain CIDRs
#              static  argument = comma-separated CIDRs (provider publishes no machine list)
#   minimum    minimal number of valid ranges; below it the source is considered broken and
#              its previous list is kept / nombre minimal de plages valides ; en dessous, la
#              source est jugée cassée et sa liste précédente est conservée
#
# Inclusion policy / Politique d'inclusion
#   EN  Only addresses operated by the provider itself (crawlers, webhooks, resolvers, MTAs).
#       Never rentable cloud space (AWS, Google Cloud, Azure, Oracle, DigitalOcean, Linode,
#       Vultr, Cloudflare Workers on the web) and never shared emailing pools (Brevo, Mailjet,
#       Mailgun, Mailchimp): that is exactly where scanners and spammers live.
#       Official provider list first; otherwise the provider's own ASN through RIPEstat.
#   FR  Uniquement des adresses exploitées par le fournisseur lui-même. Jamais de cloud
#       louable ni de pool d'emailing partagé : c'est là que vivent scanners et spammeurs.
#       Liste officielle du fournisseur d'abord, à défaut son propre AS via RIPEstat.

# ── Search engines / Moteurs de recherche ───────────────────────────────────
web|googlebot|url|https://developers.google.com/static/search/apis/ipranges/googlebot.json|prefixes|80
web|google-special-crawlers|url|https://developers.google.com/static/search/apis/ipranges/special-crawlers.json|prefixes|60
web|google-user-fetchers|url|https://developers.google.com/static/search/apis/ipranges/user-triggered-fetchers.json|prefixes|250
web|google-user-fetchers-google|url|https://developers.google.com/static/search/apis/ipranges/user-triggered-fetchers-google.json|prefixes|120
web|bingbot|url|https://www.bing.com/toolbox/bingbot.json|prefixes|10
web|applebot|url|https://search.developer.apple.com/applebot.json|prefixes|10
web|duckduckbot|url|https://duckduckgo.com/duckduckbot.json|prefixes|200

# ── Social networks (link previews) — no published list: provider ASN ───────
# Meta (Facebook, Instagram, WhatsApp): AS32934, the method Meta documents for its crawlers
web|meta|url|https://stat.ripe.net/data/announced-prefixes/data.json?resource=AS32934|data.prefixes|100
web|linkedin|url|https://stat.ripe.net/data/announced-prefixes/data.json?resource=AS14413|data.prefixes|5
web|x-twitter|url|https://stat.ripe.net/data/announced-prefixes/data.json?resource=AS13414|data.prefixes|5

# ── AI assistants (crawlers and user-triggered fetches) ─────────────────────
web|openai-gptbot|url|https://openai.com/gptbot.json|prefixes|5
web|openai-chatgpt-user|url|https://openai.com/chatgpt-user.json|prefixes|100
web|openai-searchbot|url|https://openai.com/searchbot.json|prefixes|15
web|perplexitybot|url|https://www.perplexity.ai/perplexitybot.json|prefixes|3
web|perplexity-user|url|https://www.perplexity.ai/perplexity-user.json|prefixes|2
# Anthropic: range published at https://docs.anthropic.com/en/api/ip-addresses (no JSON)
web|anthropic|static|160.79.104.0/21||1

# ── Webhooks ────────────────────────────────────────────────────────────────
web|stripe-webhooks|url|https://stripe.com/files/ips/ips_webhooks.json|WEBHOOKS|5

# ── Public DNS resolvers / Résolveurs DNS publics ───────────────────────────
dns|google-public-dns|dnstxt|locations.publicdns.goog||200
# Cloudflare 1.1.1.1: no resolver-only egress list → Cloudflare ranges, acceptable here because
# the dns category is limited to port 53
dns|cloudflare|url|https://www.cloudflare.com/ips-v4||10
# Quad9, OpenDNS: no published egress list (not included)

# ── Outbound mail of major mailbox providers (SPF) ──────────────────────────
mail|google|spf|_spf.google.com|google.com|2
mail|microsoft-365|spf|spf.protection.outlook.com|outlook.com|4
mail|outlook-com|spf|spf2.outlook.com|outlook.com|2
mail|apple-icloud|spf|_spf.icloud.com|icloud.com,apple.com|2
mail|orange|spf|orange.fr|orange.fr,orange.com|2
mail|wanadoo|spf|wanadoo.fr|wanadoo.fr,orange.com|2
mail|free|spf|free.fr|free.fr|1
mail|sfr|spf|sfr.fr|sfr.fr|2
mail|laposte|spf|laposte.net|laposte.net,as8677.net|1
# Not included / non retenus :
#   OVH        SPF based on ptr (mx.ovh.com): cannot be turned into ranges
#   Yahoo/AOL  _spf.mail.yahoo.com publishes 34.2.64.0/19, which overlaps rentable Google Cloud
#              space (34.2.76.0/23 in gstatic cloud.json), plus ptr
# Kept / conservés :
#   SFR's SPF includes two single third-party addresses (AWS 52.36.127.248, Mailchimp
#   198.2.187.67): single /32, port 25 only

# ── Grey list: never exempt, never counted for a /24 ban ────────────────────
# iCloud Private Relay (Apple → Akamai / Cloudflare / Fastly egress), shared by many users
grey|icloud-private-relay|url|https://mask-api.icloud.com/egress-ip-ranges.csv|csv|20000
